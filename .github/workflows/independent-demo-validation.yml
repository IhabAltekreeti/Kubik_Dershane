name: Independent demo validation

on:
  push:
    branches:
      - "experiment/independent-demo"
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Build frontend
        run: set -o pipefail; npm run build 2>&1 | tee build-output.log
      - name: Publish build diagnostics
        if: failure()
        run: |
          if [ -f build-output.log ]; then
            echo '### Build diagnostics' >> "$GITHUB_STEP_SUMMARY"
            echo '```text' >> "$GITHUB_STEP_SUMMARY"
            cat build-output.log >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Type-check project
        run: npm run lint
      - name: Run integrity tests
        run: npm test
